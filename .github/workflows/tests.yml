# NFR-4 and T-P3 — the suite runs on macOS (arm64) and Windows (x86-64) from
# one source tree, with no CUDA, no compiled extension and no platform-specific
# build step.  Until this file existed, "green on Mac and Windows" (Day 1's
# acceptance criterion) was asserted by a test that had only ever run on a Mac.
#
# The suite needs no dataset: every test builds its own data in tmp_path, the
# synthetic scenes are ray-cast from committed CSVs, and the ONNX models are in
# the repo.  So a bare checkout is a complete test environment — which is the
# property worth protecting, and this workflow is what notices when it breaks.

name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    name: pytest · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # a Windows-only failure must not hide a Mac one
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # backend/requirements.txt pins the versions the perception work was
          # measured on; 3.14 is the interpreter they were measured under.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -e model/

      - name: Run the suite
        working-directory: model
        run: python -m pytest -q

      - name: Regenerate the FR-40 scene registry and check it is unchanged
        working-directory: model
        run: |
          python -m avr25d.synth.registry
          git diff --exit-code -- data/scenes_registry.json
